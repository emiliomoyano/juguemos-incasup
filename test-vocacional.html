<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué docente llevás adentro?</title>
<style>
  /* Todo el estilo está encapsulado bajo #ics-vt para no chocar con la web del Instituto */
  #ics-vt {
    --morado: #4B2D6E;
    --morado-2: #6B4A92;
    --oro: #B8960C;
    --oro-claro: #F4ECCF;
    --tinta: #2A2233;
    --gris: #6E6878;
    --papel: #FBF8F2;
    --blanco: #FFFFFF;
    --borde: #E6DFD2;
    font-family: Calibri, "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--tinta);
    line-height: 1.5;
    padding: 16px;
    background: transparent;
  }
  #ics-vt *, #ics-vt *::before, #ics-vt *::after { box-sizing: border-box; }
  #ics-vt h1, #ics-vt h2, #ics-vt h3 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; margin: 0; line-height: 1.2; }
  #ics-vt p { margin: 0; }
  #ics-vt button { font: inherit; cursor: pointer; }
  #ics-vt button:focus-visible, #ics-vt a:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }

  #ics-vt .vt-card {
    max-width: 720px; margin: 0 auto; background: var(--papel);
    border: 1px solid var(--borde); border-radius: 20px; overflow: hidden;
    box-shadow: 0 12px 32px -12px rgba(75, 45, 110, .25);
  }
  #ics-vt .vt-top {
    background: var(--morado); color: var(--blanco); padding: 18px 24px 16px;
  }
  #ics-vt .vt-top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
  #ics-vt .vt-inst { letter-spacing: .08em; text-transform: uppercase; font-size: 12px; opacity: .85; }
  #ics-vt .vt-count { color: var(--oro-claro); font-variant-numeric: tabular-nums; }
  #ics-vt .vt-bar { margin-top: 12px; height: 6px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
  #ics-vt .vt-bar-fill { height: 100%; width: 0; background: var(--oro); border-radius: 99px; transition: width .4s ease; }

  #ics-vt .vt-body { padding: 28px 24px 24px; }
  #ics-vt .vt-screen { animation: vtIn .35s ease; }
  @keyframes vtIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Inicio */
  #ics-vt .vt-start { text-align: center; padding: 12px 0 8px; }
  #ics-vt .vt-emblem { margin-bottom: 14px; }
  #ics-vt .vt-emblem img { display: block; height: 140px; width: auto; margin: 0 auto; }
  #ics-vt .vt-kicker { color: var(--oro); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 700; }
  #ics-vt .vt-start h1 { font-size: clamp(28px, 6vw, 40px); color: var(--morado); margin: 8px 0 14px; }
  #ics-vt .vt-start p.vt-lead { max-width: 520px; margin: 0 auto; color: var(--gris); font-size: 17px; }
  #ics-vt .vt-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 22px 0 26px; }
  #ics-vt .vt-chip { background: var(--blanco); border: 1px solid var(--borde); border-radius: 99px; padding: 6px 12px; font-size: 14px; }

  #ics-vt .vt-btn {
    border: 0; border-radius: 12px; padding: 14px 26px; font-weight: 700; font-size: 17px;
    background: var(--morado); color: var(--blanco); transition: background .2s, transform .15s;
  }
  #ics-vt .vt-btn:hover { background: var(--morado-2); transform: translateY(-1px); }
  #ics-vt .vt-btn-sec { background: var(--blanco); color: var(--morado); border: 1.5px solid var(--morado); }
  #ics-vt .vt-btn-sec:hover { background: var(--oro-claro); }
  #ics-vt .vt-link { background: none; border: 0; color: var(--gris); text-decoration: underline; padding: 6px 0; font-size: 15px; }
  #ics-vt .vt-link:disabled { visibility: hidden; }

  /* Pregunta */
  #ics-vt .vt-qtitle { color: var(--oro); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; font-weight: 700; }
  #ics-vt .vt-q h2 { font-size: clamp(21px, 4.5vw, 26px); color: var(--morado); margin: 6px 0 20px; }
  #ics-vt .vt-opts { display: grid; gap: 10px; }
  #ics-vt .vt-opt {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 14px;
    padding: 14px 16px; color: var(--tinta); font-size: 16px;
    transition: border-color .15s, background .15s, transform .15s;
  }
  #ics-vt .vt-opt:hover { border-color: var(--morado-2); background: #F7F2FB; transform: translateY(-1px); }
  #ics-vt .vt-opt.is-picked { border-color: var(--morado); background: #EFE6F7; }
  #ics-vt .vt-letter {
    flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: var(--oro-claro); color: var(--morado); font-weight: 700; font-size: 13px; margin-top: 1px;
  }
  #ics-vt .vt-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }

  /* Resultado */
  #ics-vt .vt-res-head { text-align: center; margin-bottom: 20px; }
  #ics-vt .vt-res-head h2 { font-size: clamp(24px, 5vw, 30px); color: var(--morado); margin-top: 6px; }
  #ics-vt .vt-win {
    background: var(--blanco); border: 1px solid var(--borde); border-left: 6px solid var(--c, var(--morado));
    border-radius: 16px; padding: 20px 20px 18px; margin-bottom: 14px;
  }
  #ics-vt .vt-win-top { display: flex; gap: 14px; align-items: center; }
  #ics-vt .vt-win-ico {
    flex: none; width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; font-size: 28px;
    background: color-mix(in srgb, var(--c) 14%, white);
  }
  #ics-vt .vt-win h3 { font-size: 22px; color: var(--tinta); }
  #ics-vt .vt-win .vt-lema { font-style: italic; color: var(--c); font-family: Georgia, serif; }
  #ics-vt .vt-win .vt-desc { margin-top: 12px; font-size: 16px; }
  #ics-vt .vt-caps { margin-top: 14px; padding: 12px 14px; background: var(--papel); border-radius: 10px; font-size: 14.5px; }
  #ics-vt .vt-caps strong { display: block; color: var(--morado); margin-bottom: 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  #ics-vt .vt-caps ul { margin: 0; padding-left: 18px; }
  #ics-vt .vt-caps li + li { margin-top: 4px; }
  #ics-vt .vt-win a.vt-more { display: inline-block; margin-top: 14px; color: var(--morado); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--oro); }

  #ics-vt .vt-rank { background: var(--blanco); border: 1px solid var(--borde); border-radius: 16px; padding: 18px 20px; margin-top: 6px; }
  #ics-vt .vt-rank h3 { font-size: 18px; color: var(--morado); margin-bottom: 12px; }
  #ics-vt .vt-row { display: grid; grid-template-columns: 26px 1fr 44px; gap: 10px; align-items: center; font-size: 14.5px; }
  #ics-vt .vt-row + .vt-row { margin-top: 10px; }
  #ics-vt .vt-row .vt-track { height: 8px; background: #EEE9E0; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  #ics-vt .vt-row .vt-fill { height: 100%; width: 0; border-radius: 99px; transition: width .8s ease; }
  #ics-vt .vt-row .vt-pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--gris); }

  #ics-vt .vt-note { text-align: center; color: var(--gris); font-size: 14.5px; margin: 18px auto 0; max-width: 520px; }
  #ics-vt .vt-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
  #ics-vt .vt-toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--tinta); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #ics-vt .vt-toast.is-on { opacity: 1; }
  #ics-vt .vt-hidden { display: none !important; }

  @media (max-width: 480px) {
    #ics-vt { padding: 8px; }
    #ics-vt .vt-body { padding: 22px 16px 18px; }
    #ics-vt .vt-top { padding: 14px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #ics-vt *, #ics-vt *::before, #ics-vt *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body style="margin:0">

<div id="ics-vt">
  <div class="vt-card">
    <div class="vt-top">
      <div class="vt-top-row">
        <span class="vt-inst" id="vt-inst">Instituto Católico Superior</span>
        <span class="vt-count vt-hidden" id="vt-count" aria-live="polite"></span>
      </div>
      <div class="vt-bar vt-hidden" id="vt-bar"><div class="vt-bar-fill" id="vt-bar-fill"></div></div>
    </div>

    <div class="vt-body" id="vt-body"></div>
  </div>
  <div class="vt-toast" id="vt-toast" role="status"></div>
</div>

<script>
(function () {
  /* ====================================================================
     CONFIGURACIÓN — lo único que hace falta tocar para publicarlo
     ==================================================================== */
  const CONFIG = {
    institucion: 'Instituto Católico Superior',
    // WhatsApp institucional: código de país + área + número, sin espacios ni signos
    // (ej.: '5493511234567'). Si queda vacío, el botón no se muestra.

    // Mensaje que llega precargado al WhatsApp del Instituto
    textoWhatsapp: (carrera) => `Hola, jugué a «¿Qué docente llevás adentro?» en la web y me salió ${carrera}. Quisiera saber más sobre la carrera.`,
    // Texto que se copia o comparte al final
    textoCompartir: (carrera) => `Jugué a «¿Qué docente llevás adentro?» del Instituto Católico Superior y me salió ${carrera}. ¿Y a vos?`
  };

  /* ====================================================================
     CARRERAS — url: reemplazar "#" por la página de cada carrera
     caps: capacidades de la Res. CFE 337/18 que la carrera pone en primer plano
     ==================================================================== */
  const CARRERAS = {

      desc: 'Te sentís a gusto donde se aprende jugando y explorando con el cuerpo entero. La formación te prepara para acompañar a chicos desde los 45 días hasta los 5 años, pensar la sala como un espacio que también enseña y trabajar codo a codo con las familias en los años en que todo empieza.',
      caps: [
        [19, 'Generar un clima favorable a la convivencia y el aprendizaje.'],
        [25, 'Desarrollar estrategias de comunicación variadas con las familias.']

      desc: 'Te entusiasma la etapa en que los chicos descubren que las letras dicen cosas y que los números sirven para algo. Como maestra o maestro de 6 a 12 años vas a enseñar de todo un poco, con la energía de un aula que pregunta sin parar y la responsabilidad de acompañar una alfabetización que deja huella para siempre.',
      caps: [
        [2, 'Seleccionar, organizar y secuenciar los contenidos para favorecer el aprendizaje.'],

      url: 'https://incasup.edu.ar/profesorado-en-educacion-primaria/'
    },
    ESP: {
      nombre: 'Profesorado de Educación Especial', icono: '🤝', color: '#B83D5E',
      lema: 'Donde hay alguien, hay una manera',
      desc: 'Te mueve que cada persona encuentre su forma de aprender y de participar. La formación te prepara para enseñar a estudiantes con discapacidad en distintos niveles y contextos, diseñar apoyos y materiales accesibles y trabajar junto a otros docentes para que la escuela les haga lugar a todos.',
      caps: [
        [4, 'Tomar decisiones pedagógicas que reconozcan y respeten la diversidad.'],
        [12, 'Diversificar las tareas según los distintos ritmos y grados de avance.']
      ],
      url: 'https://incasup.edu.ar/profesorado-en-educacion-especial/'
    },
    MAT: {
      nombre: 'Profesorado de Educación Secundaria en Matemática', icono: '📐', color: '#2F5DA8',

      desc: 'Disfrutás cuando algo que parecía un enredo empieza a tener lógica. En el profesorado vas a profundizar la matemática y a pensar cómo se enseña a adolescentes y jóvenes, buscando que un chico de secundaria descubra que razonar puede ser un placer.',
      caps: [
        [1, 'Producir versiones del conocimiento adecuadas a quienes aprenden.'],
        [13, 'Usar la evaluación para identificar errores sistemáticos y ajustar la ayuda.']

      url: 'https://incasup.edu.ar/profesorado-de-matematica/'
    },
    LEN: {
      nombre: 'Profesorado de Educación Secundaria en Lengua y Literatura', icono: '📖', color: '#7A3E9D',

      desc: 'Te interesan las palabras, las que se leen en voz baja y las que se discuten en voz alta. El profesorado te forma para enseñar lengua y literatura en la secundaria, acompañar a adolescentes que están construyendo su propia voz y abrirles libros que quizás nunca habrían encontrado por su cuenta.',
      caps: [
        [20, 'Promover la formulación de preguntas y el intercambio de puntos de vista.'],
        [14, 'Diseñar evaluaciones que permitan mostrar lo aprendido de múltiples maneras.']
      ],
      url: 'https://incasup.edu.ar/profesorado-en-lengua-y-literatura/'
    },
    SAG: {
      nombre: 'Profesorado en Ciencias Sagradas', icono: '🕊️', color: '#A07F08',
      lema: 'Enseñar las preguntas grandes',
      desc: 'Te atraen las preguntas por el sentido, la fe y la manera de vivir con otros. El profesorado te prepara para enseñar en el área de formación religiosa y acompañar a niños y jóvenes en su crecimiento humano y espiritual, en diálogo con la cultura y con la vida concreta de cada comunidad.',
      caps: [
        [18, 'Enseñar las habilidades para vincularse responsablemente con los otros.'],
        [24, 'Diseñar experiencias que recuperen la cultura de las familias y la comunidad.']

      url: 'https://incasup.edu.ar/ciencias-sagradas/'

    PSI: {

      caps: null, // la Res. 337/18 rige para profesorados; la tecnicatura tiene su propio perfil
      url: 'https://incasup.edu.ar/psicopedagogia/'
    }
  };

  /* ====================================================================
     PREGUNTAS — cada opción suma puntos a una o más carreras (p: {...})
     ==================================================================== */
  /*DATA-START*/
  const PREGUNTAS = [
    {
      titulo: 'Un museo',
      texto: 'Vas a un museo que no conocés. ¿Dónde te quedás más tiempo?',
      op: [
        { t: 'Tratando de descubrir cómo funciona la maqueta de un mecanismo antiguo.', p: { MAT: 2 } },

        { t: 'En la sala donde se puede tocar y probar todo.', p: { INI: 2 } },

      ]
    },
    {
      titulo: 'Otro idioma',
      texto: 'Un amigo se muda a un país cuyo idioma no habla. ¿Cómo lo ayudás?',
      op: [

        { t: 'Le recomendás novelas escritas en ese idioma.', p: { LEN: 2 } },
        { t: 'Le hacés tarjetas con dibujos para lo básico: pedir un café, tomar un colectivo.', p: { ESP: 2, INI: 1 } },
        { t: 'Averiguás qué le cuesta más antes de proponerle nada.', p: { PSI: 2 } },
        { t: 'Lo ayudás a encontrar una comunidad donde sentirse en casa.', p: { SAG: 2 } },
        { t: 'Le enseñás canciones y juegos, como aprendimos de chicos.', p: { INI: 2 } },
        { t: 'Le explicás la gramática como un sistema de reglas.', p: { MAT: 2 } }
      ]
    },
    {
      titulo: 'Sobremesa',
      texto: 'En una sobremesa larga, ¿qué conversación te atrapa?',
      op: [
        { t: 'Un acertijo que nadie logra resolver.', p: { MAT: 2 } },
        { t: 'La discusión sobre el final de una película.', p: { LEN: 2 } },
        { t: 'Por qué somos como somos.', p: { PSI: 2 } },
        { t: 'Lo que cada uno cree y lo que le da sentido a su vida.', p: { SAG: 2 } },
        { t: 'Las ocurrencias de los más chicos de la familia.', p: { INI: 2, PRI: 1 } },
        { t: 'La historia de alguien que se las ingenió para hacer lo que le decían imposible.', p: { ESP: 2 } },
        { t: 'Las cosas que aprendimos de chicos y hoy casi nadie sabe hacer, como dividir a mano o recitar las capitales.', p: { PRI: 2 } }
      ]
    },
    {
      titulo: 'Cumpleaños familiar',
      texto: 'Cumpleaños familiar. Después de comer, ¿dónde terminás?',
      op: [
        { t: 'En el piso, con los más chiquitos, haciendo torres para que las derriben.', p: { INI: 2 } },
        { t: 'Enseñándole a un sobrino a jugar al truco.', p: { PRI: 2 } },
        { t: 'En un rincón con los primos adolescentes, discutiendo de cualquier cosa.', p: { MAT: 2, LEN: 2, SAG: 2 } },
        { t: 'Adaptando el juego para que pueda sumarse la abuela, que no se mueve bien.', p: { ESP: 2 } },
        { t: 'Charlando con un primo al que le está yendo mal en la escuela.', p: { PSI: 2, ESP: 1 } }
      ]
    },
    {
      titulo: 'Tu don',
      texto: '¿Qué te sale mejor?',
      op: [
        { t: 'Hacer reír a un bebé.', p: { INI: 2 } },
        { t: 'Explicar las reglas de un juego nuevo.', p: { PRI: 2 } },
        { t: 'Sostener una discusión que se pone intensa.', p: { LEN: 2, SAG: 1 } },
        { t: 'Calcular a ojo cuánto pone cada uno cuando llega la cuenta.', p: { MAT: 2 } },
        { t: 'Adaptar una explicación para quien no puede seguirla como está.', p: { ESP: 2, PSI: 1 } },
        { t: 'Descubrir en qué punto exacto alguien se perdió.', p: { PSI: 2 } },
        { t: 'Hablar de temas profundos sin ponerte solemne.', p: { SAG: 2 } }

    {
      titulo: 'El viaje',
      texto: 'Tus amigos organizan un viaje a último momento. ¿Qué rol te sale natural?',

        { t: 'Buscar un lugar para ver el atardecer en silencio.', p: { SAG: 2 } },

    body.appendChild(s);
  }

  function empezar() {
    respuestas = [];
    ordenes = PREGUNTAS.map(q => mezclar(q.op.length));
    count.classList.remove('vt-hidden');
    bar.classList.remove('vt-hidden');
    pantallaPregunta(0);
  }

  function pantallaPregunta(i) {
    const q = PREGUNTAS[i];
    count.textContent = `${i + 1} de ${PREGUNTAS.length}`;
    barFill.style.width = `${(i / PREGUNTAS.length) * 100}%`;
    body.innerHTML = '';

    const s = el('div', 'vt-screen vt-q');
    s.appendChild(el('div', 'vt-qtitle', q.titulo));
    const h = el('h2');
    h.textContent = q.texto;
    s.appendChild(h);

    const opts = el('div', 'vt-opts');
    ordenes[i].forEach((idx, pos) => {
      const b = el('button', 'vt-opt');
      b.type = 'button';
      if (respuestas[i] === idx) b.classList.add('is-picked');
      b.innerHTML = `<span class="vt-letter">${String.fromCharCode(65 + pos)}</span><span></span>`;
      b.lastChild.textContent = q.op[idx].t;
      b.addEventListener('click', () => elegir(i, idx, b));
      opts.appendChild(b);
    });
    s.appendChild(opts);

    const nav = el('div', 'vt-nav');
    const atras = el('button', 'vt-link', '← Pregunta anterior');
    atras.type = 'button';
    atras.disabled = i === 0;
    atras.addEventListener('click', () => pantallaPregunta(i - 1));
    nav.appendChild(atras);
    s.appendChild(nav);

    body.appendChild(s);
    h.setAttribute('tabindex', '-1');
    if (i > 0) h.focus({ preventScroll: true });
  }

  function elegir(i, idx, boton) {
    respuestas[i] = idx;
    boton.classList.add('is-picked');
    setTimeout(() => {
      if (i + 1 < PREGUNTAS.length) pantallaPregunta(i + 1);
      else pantallaResultado();
    }, 180);
  }

  function calcular() {
    const pts = {};
    KEYS.forEach(k => pts[k] = 0);
    respuestas.forEach((idx, i) => {
      const p = PREGUNTAS[i].op[idx].p;
      Object.keys(p).forEach(k => pts[k] += p[k]);
    });
    return KEYS
      .map(k => ({ k, pct: Math.round((pts[k] / MAXIMO[k]) * 100) }))
      .sort((a, b) => b.pct - a.pct);
  }

  function tarjeta(k) {
    const c = CARRERAS[k];
    const w = el('div', 'vt-win');
    w.style.setProperty('--c', c.color);
    let caps = '';
    if (c.caps) {
      caps = `<div class="vt-caps"><strong>Algunas capacidades que vas a desarrollar</strong><ul>` +
        c.caps.map(([n, t]) => `<li>${t}</li>`).join('') + `</ul></div>`;
    }
    w.innerHTML = `
      <div class="vt-win-top">
        <div class="vt-win-ico" aria-hidden="true">${c.icono}</div>
        <div><h3>${c.nombre}</h3><div class="vt-lema">${c.lema}</div></div>
      </div>
      <p class="vt-desc">${c.desc}</p>
      ${caps}
      <a class="vt-more" href="${c.url}" target="_top">Conocé la carrera →</a>`;
    return w;
  }

  function pantallaResultado() {
    count.textContent = '¡Listo!';
    barFill.style.width = '100%';
    const orden = calcular();
    const top = orden[0].pct;
    const ganadoras = orden.filter(o => o.pct === top).slice(0, 2);

    body.innerHTML = '';
    const s = el('div', 'vt-screen');
    const head = el('div', 'vt-res-head');
    head.innerHTML = `<div class="vt-kicker">Tu resultado</div><h2>${
      ganadoras.length > 1 ? 'Tenés dos afinidades igual de fuertes' : 'Tu afinidad más fuerte es con…'}</h2>`;
    s.appendChild(head);
    ganadoras.forEach(g => s.appendChild(tarjeta(g.k)));

    const rank = el('div', 'vt-rank');
    rank.appendChild(el('h3', '', 'Cómo te fue con cada carrera'));
    orden.forEach(o => {
      const c = CARRERAS[o.k];
      const r = el('div', 'vt-row');
      r.innerHTML = `<span aria-hidden="true">${c.icono}</span>
        <div><div>${c.nombre}</div><div class="vt-track"><div class="vt-fill" style="background:${c.color}"></div></div></div>
        <span class="vt-pct">${o.pct}%</span>`;
      rank.appendChild(r);
    });
    s.appendChild(rank);

    s.appendChild(el('p', 'vt-note',
      'Tomalo como un juego: sirve para empezar a pensar tu vocación, y esa conversación sigue mejor en persona. Te esperamos en el Instituto para contarte más.'));

    const act = el('div', 'vt-actions');
    const carreraTop = CARRERAS[ganadoras[0].k].nombre;
    if (CONFIG.whatsapp) {
      const wa = el('a', 'vt-btn', 'Consultanos por WhatsApp');
      wa.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(CONFIG.textoWhatsapp(carreraTop))}`;
      wa.target = '_blank'; wa.rel = 'noopener'; wa.style.textDecoration = 'none';
      act.appendChild(wa);
    }
    const comp = el('button', 'vt-btn vt-btn-sec', 'Compartir resultado');
    comp.type = 'button';
    comp.addEventListener('click', () => compartir(carreraTop));
    const otra = el('button', 'vt-btn vt-btn-sec', 'Hacerlo de nuevo');
    otra.type = 'button';
    otra.addEventListener('click', empezar);
    act.append(comp, otra);
    s.appendChild(act);

    body.appendChild(s);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      s.querySelectorAll('.vt-fill').forEach((f, i) => f.style.width = orden[i].pct + '%');
    }));
    root.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function compartir(carrera) {
    const texto = CONFIG.textoCompartir(carrera);
    if (navigator.share) {
      navigator.share({ text: texto }).catch(() => {});
      return;
    }
    const aviso = () => toast('Copiado. Ya podés pegarlo donde quieras.');
    if (navigator.clipboard) navigator.clipboard.writeText(texto).then(aviso, () => copiarViejo(texto, aviso));
    else copiarViejo(texto, aviso);
  }

  function copiarViejo(texto, ok) {
    const t = document.createElement('textarea');
    t.value = texto; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); ok(); } catch (e) {}
    t.remove();
  }

  function toast(msg) {
    const t = root.querySelector('#vt-toast');
    t.textContent = msg;
    t.classList.add('is-on');
    setTimeout(() => t.classList.remove('is-on'), 2600);
  }

  pantallaInicio();
})();
</script>
</body>
</html>
